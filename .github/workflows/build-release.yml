name: Build release JAR

on:
  push:
    branches:
      - update/26.3-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build release JAR
        run: mvn --batch-mode clean package

      - name: Stage release JAR
        shell: bash
        run: |
          mkdir -p release
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" release/HelpCommand-2.9.4.jar

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: HelpCommand-2.9.4
          path: release/HelpCommand-2.9.4.jar
          if-no-files-found: error
